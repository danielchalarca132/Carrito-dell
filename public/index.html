<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carrito de Compras</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="hero-card">
        <div>
          <p class="eyebrow">Tienda</p>
          <h1>Carrito de compras</h1>
          <p class="lead">Explora productos, agrega artículos y revisa tu total en tiempo real.</p>
        </div>
        <div class="badge">Demo frontend</div>
      </header>

      <section class="content-grid">
        <article class="panel">
          <div class="panel-header">
            <h2>Productos</h2>
            <span id="countLabel">0 productos</span>
          </div>
          <div id="productGrid" class="product-grid"></div>
        </article>

        <aside class="panel cart-panel">
          <div class="panel-header">
            <h2>Tu carrito</h2>
            <span id="cartCount">0 artículos</span>
          </div>

          <div id="cartItems" class="cart-items"></div>

          <div class="summary-box">
            <div class="summary-row">
              <span>Subtotal</span>
              <strong id="subtotalValue">$0</strong>
            </div>
            <div class="summary-row">
              <span>Envío</span>
              <strong>Gratis</strong>
            </div>
            <div class="summary-row total-row">
              <span>Total</span>
              <strong id="totalValue">$0</strong>
            </div>
          </div>

          <button id="checkoutBtn" class="checkout-btn" disabled>Finalizar compra</button>
        </aside>
      </section>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
